name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          # GitHub's current ubuntu-latest image no longer ships a Python 3.9 build.
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-22.04
            python-version: "3.9"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run gesture tests (headless)
        run: python test_gestures.py

      - name: Run camera tests (headless)
        run: python test_camera.py

      - name: Run config tests (headless)
        run: python test_config.py

  package-windows:
    name: Build Windows executable
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (same command as release workflow)
        run: python -m PyInstaller --clean --noconfirm --onefile --name Eidak hand_gesture_control.py

      - name: Verify executable exists
        run: |
          if (!(Test-Path "dist/Eidak.exe")) { throw "PyInstaller did not create dist/Eidak.exe" }

      - name: Smoke test packaged executable
        run: |
          & ".\\dist\\Eidak.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable failed its --help smoke test" }

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check source and tests
        run: ruff check .
